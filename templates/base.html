<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="{% block description %}Ahamed Wajibu. Math at Waterloo. I build AI systems and tools.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  <title>{% block title %}Ahamed Wajibu{% endblock %}</title>
  {% block metadata %}{% endblock %}
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/newsreader-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/dm-sans-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('aw-theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/notebook.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
