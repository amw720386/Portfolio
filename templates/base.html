<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="{{ seo.description }}">
  <meta name="robots" content="{{ seo.robots|default('index, follow') }}">
  <title>{{ seo.title }}</title>
  {% if seo.canonical %}
  <link rel="canonical" href="{{ seo.canonical }}">
  <meta property="og:type" content="{{ seo.type }}">
  <meta property="og:site_name" content="Ahamed Wajibu">
  <meta property="og:locale" content="en_CA">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical }}">
  <meta property="og:image" content="{{ seo.image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ahamed Wajibu — AI systems and software, mathematics at Waterloo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ seo.title }}">
  <meta name="twitter:description" content="{{ seo.description }}">
  <meta name="twitter:image" content="{{ seo.image }}">
  <meta name="twitter:image:alt" content="Ahamed Wajibu — AI systems and software, mathematics at Waterloo">
  {% endif %}
  {% if seo.schema %}<script type="application/ld+json">{{ seo.schema|tojson }}</script>{% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/newsreader-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/dm-sans-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('aw-theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/notebook.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
